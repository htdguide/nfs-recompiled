<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Need for Speed — WebAssembly</title>
<style>
  html, body { margin: 0; height: 100%; background: #101014; color: #d0d0d8;
               font-family: system-ui, sans-serif; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar  { padding: 6px 10px; font-size: 13px; background: #17171d;
          border-bottom: 1px solid #2a2a33; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center;
           background: #000; min-height: 0; }
  #stage:fullscreen { background: #000; }
  canvas { background: #000; width: 100%; height: 100%; object-fit: contain;
           display: block; outline: none; }
  #status { color: #8a8; }
  #fsbtn { float: right; cursor: pointer; background: none; border: 1px solid #2a2a33;
           color: #d0d0d8; border-radius: 4px; padding: 1px 8px; font-size: 12px; }
  #fsbtn:hover { border-color: #6cf; color: #6cf; }
  a { color: #6cf; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <button id="fsbtn" title="Fullscreen (or double-click the game)">⛶ fullscreen</button>
    NFS-recompiled (WASM) — <span id="status">loading…</span>
    &nbsp;·&nbsp; requires original game data mounted at <code>/data</code>
  </div>
  <div id="stage">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  </div>
</div>
<script>
  // The canvas backing store is owned by the game: Renderer::setVideoMode sets
  // it to the game resolution (with __gameResize set) and the offscreen GL
  // buffer is sized to match. Any other writer — SDL's fullscreen/resize
  // handling, emscripten momentarily resetting it to 0x0 — would desync the two
  // and corrupt or blank the composited frame, so those writes are ignored.
  // On-screen scaling is done purely with CSS (object-fit: contain).
  (function () {
    var proto = HTMLCanvasElement.prototype;
    var wd = Object.getOwnPropertyDescriptor(proto, 'width');
    var hd = Object.getOwnPropertyDescriptor(proto, 'height');
    var c = document.getElementById('canvas');
    Object.defineProperty(c, 'width',  { configurable: true,
      get: function () { return wd.get.call(this); },
      set: function (v) { if (this.__gameResize && v > 0) wd.set.call(this, v); } });
    Object.defineProperty(c, 'height', { configurable: true,
      get: function () { return hd.get.call(this); },
      set: function (v) { if (this.__gameResize && v > 0) hd.set.call(this, v); } });
    c.__gameResize = true;
    if (!(c.width > 0)) c.width = 640;
    if (!(c.height > 0)) c.height = 480;
    c.__gameResize = false;
  })();

  // Fullscreen: button or double-click. The stage element goes fullscreen and
  // CSS letterboxing keeps the game's aspect ratio on any display.
  (function () {
    var stage = document.getElementById('stage');
    function toggle() {
      if (document.fullscreenElement) document.exitFullscreen();
      else stage.requestFullscreen();
    }
    document.getElementById('fsbtn').addEventListener('click', toggle);
    document.getElementById('canvas').addEventListener('dblclick', toggle);
  })();

  var statusEl = document.getElementById('status');
  var Module = {
    canvas: (function () {
      var c = document.getElementById('canvas');
      // Emscripten reports WebGL context loss through this listener.
      c.addEventListener('webglcontextlost', function (e) {
        alert('WebGL context lost. Reload to continue.');
        e.preventDefault();
      }, false);
      return c;
    })(),
    arguments: ['/data'],           // data + "cd" both point at the mounted dir
    print:    function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    setStatus: function (t) { statusEl.textContent = t || 'running'; },
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.setStatus(left ? ('preparing… ' + left + ' files left') : 'running');
    }
  };
  Module.setStatus('downloading…');
  window.onerror = function (msg) { Module.setStatus('error — see console'); };
</script>
{{{ SCRIPT }}}
</body>
</html>
